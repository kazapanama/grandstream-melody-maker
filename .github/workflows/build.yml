# Збирає GSRing.exe на кожен пуш у main, а на тег vX.Y.Z ще й публікує реліз з ним.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GSRing.exe
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: GSRing
          path: GSRing.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" GSRing.exe \
            --title "GSRing ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
