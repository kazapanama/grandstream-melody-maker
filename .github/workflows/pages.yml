# Викладає вебверсію (src/index.html) на GitHub Pages після кожної її зміни в main.
name: pages

on:
  push:
    branches: [main]
    paths: [src/index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # на сайт іде лише сама сторінка — без CLI та коду запускача
      - run: mkdir _site && cp src/index.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
